<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tavily-headless</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--border:#2a2f3a;--text:#e6e9ef;--muted:#9aa3b2;--accent:#4f8cff;--danger:#ff7b72}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:24px;align-items:baseline}
h1{font-size:16px;margin:0;font-weight:600}
nav{display:flex;gap:6px}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px}
nav button.active{color:var(--text);border-color:var(--border);background:var(--panel)}
main{max-width:860px;margin:24px auto;padding:0 20px}
.panel{display:none}
.panel.visible{display:block}
form{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{background:#0c0e12;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 10px;font-size:14px;font-family:inherit}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.row label{flex-direction:row;align-items:center;gap:6px}
.row input[type=number]{width:80px}
button.primary{background:var(--accent);border:none;color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;align-self:flex-start}
button.primary:disabled{opacity:.5;cursor:default}
#status{margin-top:14px;color:var(--muted);font-size:13px;min-height:18px}
#status.error{color:var(--danger)}
#toolbar{display:none;margin-top:14px;justify-content:flex-end;gap:6px}
#toolbar.visible{display:flex}
.viewbtn{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.viewbtn.active{color:var(--text);border-color:var(--accent)}
#output{margin-top:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.card a.title{font-size:15px;font-weight:600;color:var(--text);text-decoration:none}
.card a.title:hover{text-decoration:underline}
.favicon{width:16px;height:16px;border-radius:3px;vertical-align:-3px;margin-right:6px}
.score{display:inline-block;background:#1c2942;color:#8fb4ff;border-radius:999px;padding:2px 9px;font-size:11px;margin-left:8px}
.url{font-size:12px;color:var(--muted);word-break:break-all;margin:4px 0 8px}
.meta{color:var(--muted);font-size:13px;margin:6px 0 12px}
.subhead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.content{margin:0;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.6;color:#c9d1d9}
.clamped{max-height:96px;overflow:hidden}
.expand{background:none;border:none;color:var(--accent);cursor:pointer;padding:6px 0 0;font-size:12px}
.card.fail{border-color:#5a2a30;background:#231418}
.card.fail .url{color:var(--danger)}
.sources .card{padding:10px 14px;margin-bottom:8px}
.markdown h1{font-size:20px;margin:0 0 12px}
.markdown h2{font-size:17px;margin:18px 0 8px}
.markdown h3{font-size:15px;margin:14px 0 6px}
.markdown h4{font-size:14px;margin:12px 0 4px}
.markdown p{margin:8px 0}
.markdown ul,.markdown ol{margin:8px 0;padding-left:22px}
.markdown li{margin:4px 0}
.markdown hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.markdown strong{color:var(--text)}
.markdown em{color:#d6dbe4}
.markdown code{background:#0c0e12;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.markdown blockquote{border-left:3px solid var(--border);margin:8px 0;padding:2px 12px;color:var(--muted)}
.markdown a{color:var(--accent)}
.markdown.clamped{max-height:50vh}
a{color:var(--accent)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.5;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1>tavily-headless</h1>
  <nav>
    <button data-tab="search" class="active">Search</button>
    <button data-tab="extract">Extract</button>
    <button data-tab="research">Research</button>
  </nav>
</header>
<main>
  <section id="search" class="panel visible">
    <form id="search-form">
      <label>Query
        <input id="search-query" placeholder="who is Leo Messi?">
      </label>
      <div class="row">
        <label>Depth
          <select id="search-depth">
            <option>basic</option>
            <option>advanced</option>
            <option>fast</option>
            <option>ultra-fast</option>
          </select>
        </label>
        <label>Max results
          <input id="search-max" type="number" min="1" max="20" value="10">
        </label>
        <label><input id="search-raw" type="checkbox" checked> include raw content</label>
      </div>
      <button class="primary" type="submit">Search</button>
    </form>
  </section>

  <section id="extract" class="panel">
    <form id="extract-form">
      <label>URLs (one per line, max 20)
        <textarea id="extract-urls" rows="4" placeholder="https://example.com"></textarea>
      </label>
      <button class="primary" type="submit">Extract</button>
    </form>
  </section>

  <section id="research" class="panel">
    <form id="research-form">
      <label>Topic or question
        <input id="research-query" placeholder="latest developments in AI">
      </label>
      <div class="row">
        <label>Model
          <select id="research-model">
            <option>mini</option>
            <option>pro</option>
            <option>auto</option>
          </select>
        </label>
      </div>
      <button class="primary" type="submit" id="research-btn">Run research</button>
    </form>
  </section>

  <div id="status"></div>
  <div id="toolbar">
    <button class="viewbtn active" data-view="readable">Readable</button>
    <button class="viewbtn" data-view="raw">Raw JSON</button>
  </div>
  <div id="output"></div>
</main>
<script src="marked.umd.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), outputEl = $("output"), toolbarEl = $("toolbar");
let lastData = null;
let view = "readable";

document.querySelectorAll("nav button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("visible", p.id === btn.dataset.tab));
    lastData = null;
    outputEl.innerHTML = "";
    toolbarEl.classList.remove("visible");
    setStatus("");
  });
});

document.querySelectorAll(".viewbtn").forEach((btn) => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});

function setStatus(text, isError) {
  statusEl.textContent = text || "";
  statusEl.className = isError ? "error" : "";
}

function setView(v) {
  view = v;
  document.querySelectorAll(".viewbtn").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
  renderOutput();
}

function showResult(kind, data) {
  lastData = { kind, data };
  toolbarEl.classList.add("visible");
  renderOutput();
}

function renderOutput() {
  if (!lastData) return;
  outputEl.innerHTML = "";
  if (view === "raw") {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(lastData.data, null, 2);
    outputEl.appendChild(pre);
    return;
  }
  if (lastData.kind === "search") renderSearch(lastData.data);
  else if (lastData.kind === "extract") renderExtract(lastData.data);
  else if (lastData.kind === "research") renderResearch(lastData.data);
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function meta(text) {
  return el("div", "meta", text);
}

function contentBlock(text) {
  const wrap = document.createElement("div");
  const body = el("div", "content", text || "");
  wrap.appendChild(body);
  if ((text || "").length > 700) {
    body.classList.add("clamped");
    const btn = el("button", "expand", "Show more");
    btn.addEventListener("click", () => {
      const open = body.classList.toggle("clamped");
      btn.textContent = open ? "Show more" : "Show less";
    });
    wrap.appendChild(btn);
  }
  return wrap;
}

function markdownBlock(text) {
  const wrap = document.createElement("div");
  const body = el("div", "content markdown");
  const escaped = String(text || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  body.innerHTML = marked.parse(escaped);
  wrap.appendChild(body);
  if ((body.textContent || "").length > 1500) {
    body.classList.add("clamped");
    const btn = el("button", "expand", "Show more");
    btn.addEventListener("click", () => {
      const open = body.classList.toggle("clamped");
      btn.textContent = open ? "Show more" : "Show less";
    });
    wrap.appendChild(btn);
  }
  return wrap;
}

function sourceLink(title, url, favicon) {
  const a = el("a", "title", title || url);
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  if (favicon) {
    const img = document.createElement("img");
    img.className = "favicon";
    img.src = favicon;
    img.alt = "";
    a.prepend(img);
  }
  return a;
}

function renderSearch(d) {
  outputEl.appendChild(meta((d.results || []).length + " results · " + d.response_time + "s"));
  (d.results || []).forEach((r) => {
    const card = el("div", "card");
    const head = document.createElement("div");
    head.appendChild(sourceLink(r.title, r.url, r.favicon));
    if (r.score != null) head.appendChild(el("span", "score", r.score.toFixed(2)));
    card.appendChild(head);
    card.appendChild(el("div", "url", r.url));
    card.appendChild(contentBlock(r.content));
    outputEl.appendChild(card);
  });
}

function renderExtract(d) {
  const ok = d.results || [], failed = d.failed_results || [];
  outputEl.appendChild(meta(ok.length + " extracted · " + failed.length + " failed"));
  ok.forEach((r) => {
    const card = el("div", "card");
    card.appendChild(sourceLink(r.url, r.url, r.favicon));
    card.appendChild(contentBlock(r.raw_content));
    outputEl.appendChild(card);
  });
  failed.forEach((f) => {
    const card = el("div", "card fail");
    card.appendChild(el("div", "url", f.url));
    card.appendChild(el("div", "content", f.error || "extraction failed"));
    outputEl.appendChild(card);
  });
}

function renderResearch(d) {
  const res = d.result || d;
  outputEl.appendChild(meta("status: " + (d.status || "completed")));
  if (res.content) {
    const card = el("div", "card");
    card.appendChild(el("div", "subhead", "Report"));
    if (typeof res.content === "string") {
      card.appendChild(markdownBlock(res.content));
    } else {
      card.appendChild(contentBlock(JSON.stringify(res.content, null, 2)));
    }
    outputEl.appendChild(card);
  }
  if (Array.isArray(res.sources) && res.sources.length) {
    const wrap = el("div", "sources");
    wrap.appendChild(el("div", "subhead", "Sources"));
    res.sources.forEach((s) => {
      const card = el("div", "card");
      card.appendChild(sourceLink(s.title, s.url, s.favicon));
      card.appendChild(el("div", "url", s.url));
      wrap.appendChild(card);
    });
    outputEl.appendChild(wrap);
  }
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

$("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  setStatus("Searching...");
  try {
    const data = await postJSON("/api/search", {
      query: $("search-query").value,
      depth: $("search-depth").value,
      max_results: parseInt($("search-max").value, 10) || 10,
      include_raw: $("search-raw").checked,
    });
    showResult("search", data);
    setStatus("");
  } catch (err) { setStatus(err.message, true); }
});

$("extract-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const urls = $("extract-urls").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  setStatus("Extracting...");
  try {
    const data = await postJSON("/api/extract", { urls });
    showResult("extract", data);
    setStatus("");
  } catch (err) { setStatus(err.message, true); }
});

$("research-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("research-btn");
  btn.disabled = true;
  try {
    setStatus("Starting research task...");
    const started = await postJSON("/api/research", {
      query: $("research-query").value,
      model: $("research-model").value,
    });
    let task;
    while (true) {
      const res = await fetch("/api/research?id=" + encodeURIComponent(started.request_id));
      task = await res.json();
      if (task.status === "completed") break;
      if (task.status === "failed") throw new Error(task.error || "task failed");
      setStatus("Research in progress (" + (task.status || "pending") + ")...");
      await new Promise((r) => setTimeout(r, 4000));
    }
    showResult("research", task);
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
